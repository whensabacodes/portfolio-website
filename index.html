<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Saba Qaiser — Frontend Developer & UI Engineer</title>
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('portfolio-theme');
          var theme =
            storedTheme === 'light' || storedTheme === 'dark'
              ? storedTheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);

          var storedMotion = localStorage.getItem('portfolio-reduced-motion');
          var reduced;
          if (storedMotion === 'true') reduced = true;
          else if (storedMotion === 'false') reduced = false;
          else
            reduced = window.matchMedia('(prefers-reduced-motion: reduce)')
              .matches;
          document.documentElement.setAttribute(
            'data-reduced-motion',
            reduced ? 'true' : 'false',
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.setAttribute('data-reduced-motion', 'false');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
